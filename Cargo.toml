[package]
name = "mcp-containers"
version = "2.0.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Containers MCP Server — Docker containers, images, volumes, networks, exec, logs via native socket connection"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-containers"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "containers", "docker", "bollard", "devops"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
bollard = "0.18"
futures-util = "0.3"

[workspace]

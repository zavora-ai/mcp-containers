server_id = "mcp_containers"
display_name = "Containers"
version = "2.3.0"
domain = "containers"
sdk_version = "0.2.0"
risk_level = "high"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "list_containers"
description = "List containers (set all=true to include stopped)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "inspect_container"
description = "Get container details: status, config, mounts, network"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "run_container"
description = "Run a new container from an image"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "stop_container"
description = "Stop a running container"
risk_class = "internal_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "remove_container"
description = "Remove a container (must be stopped first)"
risk_class = "internal_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "get_logs"
description = "Get container logs (last N lines)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "exec_container"
description = "Execute a command inside a running container"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_stats"
description = "Get container resource usage (CPU, memory, network I/O)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_images"
description = "List local Docker images"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "pull_image"

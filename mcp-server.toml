risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "remove_image"
description = "Remove a local image"
risk_class = "internal_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "inspect_image"
description = "Inspect an image: layers, size, config, history"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_networks"
